# Локальная база для разработки. Запуск: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: theboys
      POSTGRES_PASSWORD: theboys
      POSTGRES_DB: theboys
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
